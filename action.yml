name: 'Bump Formula'
description: 'Open or update a pull request for a formula using GitHub release assets'
inputs:
  tap_repo:
    description: 'Github repository of the homebrew tap (org/repo)'
    required: false
    default: fopina/homebrew-tap
  tap_branch:
    description: 'Branch to use'
    required: false
    default: main
  token:
    description: 'Token with contents and pull requests write access to the tap repository'
    required: true
  version:
    description: 'Release tag, for example v1.2.3'
    required: true
  formula_class:
    description: 'Formula class name'
    required: true
  formula_file:
    description: 'Formula filename without the .rb extension'
    required: true
  description:
    description: 'Formula description'
    required: true
  homepage:
    description: 'Formula homepage (defaults to the invoking GitHub repository)'
    required: false
    default: ''
  license:
    description: 'Formula license'
    required: false
    default: MIT
  bin:
    description: 'Installed executable name and release asset prefix'
    required: true
  install:
    description: 'Optional Ruby body for the formula install method (defaults to installing bin)'
    required: false
    default: ''
  test:
    description: 'Optional Ruby body for the Homebrew test do block (defaults to an executable check)'
    required: false
    default: ''
outputs:
  assets:
    description: 'JSON map of the matched release assets'
  pull_request:
    description: 'URL of the created or updated pull request'
runs:
  using: 'node24'
  main: 'dist/index.js'
